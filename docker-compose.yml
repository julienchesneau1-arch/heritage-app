# Héritage — pile complète sur un seul VPS.
#
# Tout tient sur une machine : l'application, sa base, son reverse-proxy.
# C'est le choix le moins cher et, à l'échelle d'une famille — quelques
# milliers de récits, six lecteurs — le plus simple à tenir. Rien ici
# n'appelle un service managé facturé au mois.
#
# Redis est absent volontairement : il ne sert qu'à partager les compteurs
# entre plusieurs instances. Avec une seule, le store mémoire suffit et
# l'application le dit au démarrage.
#
# ─────────────────────────────────────────────────────────────────────────
# COHABITATION — ce fichier ne peut pas prendre la place d'une autre app.
# ─────────────────────────────────────────────────────────────────────────
#
# Ce VPS héberge déjà une application en production. La version précédente
# de ce fichier réclamait les ports 80 et 443 en dur : sur une machine où un
# proxy les occupe déjà, `docker compose up` aurait soit échoué, soit — au
# redémarrage suivant de l'autre proxy — pris sa place et mis le site
# existant hors ligne. Ce n'est pas une hypothèse, c'est le mode de panne
# normal de deux piles qui s'ignorent.
#
# Trois garde-fous, dans l'ordre où ils agissent :
#
#  1. `name: heritage` fige le nom du projet. Sans lui, Compose le déduit du
#     nom du DOSSIER : conteneurs, volumes et réseau changeraient de nom
#     selon l'endroit où le dépôt a été cloné, et un `docker compose down`
#     lancé depuis le mauvais répertoire deviendrait imprévisible. Ici, tout
#     porte le préfixe `heritage_` et rien d'autre n'y répond.
#
#  2. Par défaut, l'application n'écoute que sur `127.0.0.1`. Elle n'est
#     joignable QUE depuis la machine elle-même — donc par le proxy qui
#     tourne déjà. Aucun port public n'est réclamé, aucune règle de
#     pare-feu à changer, et rien à retirer à l'application existante.
#
#  3. Le proxy Caddy de ce fichier est derrière un PROFIL. Il ne démarre
#     jamais sans qu'on le demande explicitement
#     (`docker compose --profile autonome up -d`), et cette commande n'a de
#     sens que sur une machine vierge. Sur ce VPS-ci : ne pas l'utiliser.
#
# `./preflight.sh` vérifie tout cela avant de démarrer quoi que ce soit, et
# refuse de continuer si les ports sont déjà pris.

name: heritage

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseignez POSTGRES_PASSWORD}
      POSTGRES_DB: heritage
    volumes:
      - db:/var/lib/postgresql/data
      # Les sauvegardes sortent ici, lisibles depuis l'hôte.
      - ./sauvegardes:/sauvegardes
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heritage -d heritage']
      interval: 10s
      timeout: 5s
      retries: 5
    # La base n'est jamais exposée à l'extérieur du VPS.
    expose:
      - '5432'

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://heritage:${POSTGRES_PASSWORD}@db:5432/heritage?schema=public
      # Sans elle, l'application refuse de démarrer — et c'est voulu :
      # cette clé signe tous les accès familiaux.
      FAMILY_TOKEN_SECRET: ${FAMILY_TOKEN_SECRET:?openssl rand -hex 32}
      TRANSCRIPTION_WORKER_SECRET: ${TRANSCRIPTION_WORKER_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      # Les photos et les enregistrements survivent au redéploiement.
      - archives:/data
    # Sur la BOUCLE LOCALE uniquement. `127.0.0.1:` en tête n'est pas
    # décoratif : sans ce préfixe, Docker ouvre le port sur toutes les
    # interfaces ET perce le pare-feu au passage. Ici, seul le proxy déjà
    # installé sur la machine peut joindre l'application.
    ports:
      - '127.0.0.1:${PORT_LOCAL:-8081}:3000'
    # Next journalise l'erreur de secret manquant au démarrage mais continue
    # de servir. Sans cette sonde, un déploiement dont la clé manque serait
    # déclaré sain et n'échouerait qu'à la première visite d'une famille.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/sante']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # TLS automatique, sans configuration ni renouvellement à surveiller.
  #
  # ⚠ POUR UNE MACHINE VIERGE SEULEMENT. Ce service réclame les ports 80 et
  # 443 ; sur un VPS qui sert déjà un site, il entrerait en conflit avec le
  # proxy en place. Le profil `autonome` le met hors du chemin par défaut :
  # `docker compose up -d` ne le démarre pas, et il faut l'écrire en toutes
  # lettres pour l'obtenir. Sur un serveur déjà occupé, la bonne réponse est
  # d'ajouter un vhost au proxy existant — voir DEPLOIEMENT.md.
  proxy:
    profiles: ['autonome']
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAINE: ${DOMAINE:?votre nom de domaine}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db:
  archives:
  caddy_data:
  caddy_config:
