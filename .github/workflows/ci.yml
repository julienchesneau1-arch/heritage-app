name: CI

# `02` — Phase 0 : « La CI tourne sur chaque commit. »
# `PRD §101` — lint, unit, integration, security, policy, model, tool contract.
#
# Les étapes sont volontairement séparées : quand la CI casse, on doit savoir
# immédiatement si c'est le typage, une politique, ou une garde de sécurité.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_superuser_pw
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      JARVIS_ENV: test
      JARVIS_DB_HOST: 127.0.0.1
      JARVIS_DB_PORT: '5432'
      JARVIS_DB_NAME: jarvis_test
      JARVIS_DB_USER: jarvis_app
      JARVIS_DB_PASSWORD: ci_app_pw
      JARVIS_DB_OWNER_USER: jarvis_owner
      JARVIS_DB_OWNER_PASSWORD: ci_owner_pw
      JARVIS_DB_SUPERUSER: postgres
      JARVIS_DB_SUPERUSER_PASSWORD: ci_superuser_pw

    steps:
      - uses: actions/checkout@v4
        with:
          # Le scan de secrets inspecte l'historique complet : un clone
          # superficiel le rendrait aveugle à ce qu'il cherche.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typage strict
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Aucun secret dans le dépôt ni l'historique
        run: pnpm secrets:scan

      - name: Base de données — bootstrap
        run: pnpm db:bootstrap

      - name: Migrations — aller
        run: pnpm db:migrate

      - name: Migrations — retour puis aller (rollback vérifié)
        run: |
          pnpm db:rollback
          pnpm db:rollback
          pnpm db:migrate

      # Toute la suite, en un seul appel.
      #
      # Cette étape énumérait auparavant les répertoires un par un. Deux
      # d'entre eux — `tests/server/` et `tests/redteam/` — ont été ajoutés
      # sans que personne ne pense à les inscrire ici : la CI restait verte en
      # ignorant 111 tests (audit `docs/11`, MED-1).
      #
      # Un mode d'échec silencieux est pire qu'un échec bruyant. `pnpm test`
      # découvre les fichiers ; il ne peut pas en oublier.
      - name: Suite complète
        run: pnpm test

      - name: Porte de sortie Phase 0
        run: pnpm gate:phase0

      - name: Porte de sortie Phase 1
        run: pnpm gate:phase1

      - name: Porte de sortie Phase 2
        run: pnpm gate:phase2

      # ADR-087 — la Phase 3 se déclarait franchie en comptant ses outils.
      # Une porte absente de la CI est une porte qu'on oublie de franchir.
      - name: Porte de sortie Phase 3
        run: pnpm gate:phase3

      # ADR-088 — couche de DÉCISION de l'Update Engine. La Phase 7 n'est PAS
      # franchie : l'exécution (signature, installation, canary, backups)
      # n'existe pas, et la porte l'imprime à chaque passage.
      - name: Update Engine — couche de décision (Phase 7 partielle)
        run: pnpm gate:phase7
